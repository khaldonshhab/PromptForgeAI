name: Release PromptForge AAB
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HAS_KEYSTORE}" || { echo "Missing ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "${KS_PASS}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${KEY_ALIAS}" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${KEY_PASS}" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
      - name: Build release AAB
        run: gradle :app:bundleRelease --no-daemon
      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 --decode > promptforge-upload.jks
      - name: Sign AAB with Google Play upload key
        run: |
          jarsigner             -keystore promptforge-upload.jks             -storepass "${KS_PASS}"             -keypass "${KEY_PASS}"             -sigalg SHA256withRSA             -digestalg SHA-256             app/build/outputs/bundle/release/app-release.aab             "${KEY_ALIAS}"
      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: promptforge-release-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
