<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptForge Admin</title><style>body{font-family:Arial,sans-serif;background:#050817;color:#f6f8ff;max-width:900px;margin:auto;padding:24px}section{background:#0d1831;border:1px solid #2b3d69;border-radius:18px;padding:18px;margin:14px 0}input,button{padding:12px;border-radius:10px;border:1px solid #2b3d69;margin:5px}input{background:#091228;color:white}button{background:#197fff;color:white;cursor:pointer}.danger{background:#8b2030}.user{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #2b3d69;padding:12px 0}.muted{color:#abb7d3}</style></head><body><h1>PromptForge Admin</h1><p class="muted">إدارة حسابات مستخدمي النسخة المجانية.</p><section id="login"><h2>دخول الإدارة</h2><input id="au" placeholder="اسم المدير"><input id="ap" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button></section><section id="panel" hidden><h2>المستخدمون</h2><input id="nu" placeholder="اسم المستخدم"><input id="np" type="password" placeholder="كلمة المرور (8 أحرف+)"><button onclick="addUser()">إضافة مستخدم</button><div id="users"></div><button class="danger" onclick="logout()">خروج</button></section><script>let token=new URLSearchParams(location.search).get("token")||localStorage.pfAdmin||"";if(token)localStorage.pfAdmin=token;const api=(u,o={})=>fetch(u,{...o,headers:{"Content-Type":"application/json",...(o.headers||{}),"Authorization":"Bearer "+token}});async function login(){let r=await fetch("/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:au.value,password:ap.value})});let j=await r.json();if(!r.ok)return alert("بيانات الإدارة غير صحيحة");token=j.token;localStorage.pfAdmin=token;show()}async function show(){if(!token)return;let r=await api("/admin/users");if(!r.ok){token="";localStorage.removeItem("pfAdmin");return}loginEl.hidden=true;panel.hidden=false;let j=await r.json();users.innerHTML=j.users.map(u=>'<div class="user"><span>'+u.username+' — '+(u.enabled?'فعال':'معطل')+'</span><span><button onclick="toggle(\''+encodeURIComponent(u.username)+'\','+u.enabled+')">'+(u.enabled?'تعطيل':'تفعيل')+'</button><button class="danger" onclick="del(\''+encodeURIComponent(u.username)+'\')">فك ربط الجهاز</button><button class="danger" onclick="del(\''+encodeURIComponent(u.username)+'\')">حذف</button></span></div>').join("")}async function addUser(){let r=await api("/admin/users",{method:"POST",body:JSON.stringify({username:nu.value,password:np.value})});if(!r.ok){let j=await r.json();return alert(j.error||"فشل الإضافة")}nu.value=np.value="";show()}async function toggle(u,e){await api("/admin/users/"+u,{method:"PATCH",body:JSON.stringify({enabled:!e})});show()} async function reset(u){let p=prompt("كلمة المرور الجديدة (8 أحرف+):");if(!p)return;if(p.length<8)return alert("كلمة المرور يجب أن تكون 8 أحرف على الأقل");let r=await api("/admin/users/"+u,{method:"PATCH",body:JSON.stringify({password:p})});if(!r.ok){let j=await r.json();return alert(j.error||"فشل تغيير كلمة المرور")}alert("تم تغيير كلمة المرور")}async function resetDevice(u){if(confirm("فك ربط الجهاز عن هذا الحساب؟")){let r=await api("/admin/users/"+u+"/reset-device",{method:"POST"});if(!r.ok){let j=await r.json();return alert(j.error||"فشل فك ربط الجهاز")}alert("تم فك ربط الجهاز، ويمكن تسجيل الحساب على جهاز جديد")}}async function del(u){if(confirm("حذف الحساب؟")){await api("/admin/users/"+u,{method:"DELETE"});show()}}function logout(){token="";localStorage.removeItem("pfAdmin");location.reload()}const loginEl=document.getElementById("login");show()</script></body></html>
